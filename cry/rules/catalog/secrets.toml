# CRY Embedded Secrets Catalog (Inspired by Gitleaks standard signatures)

[[rules]]
rule_id = "secret-supabase-token"
name = "Supabase API Key / Service Role Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['sbp_[a-zA-Z0-9]{40}']
description = "Supabase access token or service role key exposed in source code."
fix_hint = "Store Supabase keys in environment variables (e.g. process.env.SUPABASE_KEY or os.environ['SUPABASE_KEY'])."
suggested_fix = "const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;"

[[rules]]
rule_id = "secret-huggingface-token"
name = "Hugging Face Access Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['hf_[a-zA-Z0-9]{34}']
description = "Hugging Face API token detected in source code."
fix_hint = "Load Hugging Face token from environment variables via HF_TOKEN."
suggested_fix = "hf_token = os.environ['HF_TOKEN']"

[[rules]]
rule_id = "secret-github-pat"
name = "GitHub Personal Access Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['ghp_[0-9a-zA-Z]{36}', 'github_pat_[0-9a-zA-Z_]{82}']
description = "GitHub Personal Access Token (Classic or Fine-Grained) committed to repository."
fix_hint = "Revoke token immediately in GitHub settings and load from GITHUB_TOKEN environment variable."
suggested_fix = "const token = process.env.GITHUB_TOKEN;"

[[rules]]
rule_id = "secret-gitlab-pat"
name = "GitLab Personal Access Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['glpat-[0-9a-zA-Z_\-]{20}']
description = "GitLab Personal Access Token detected."
fix_hint = "Revoke token in GitLab profile and load via GITLAB_TOKEN environment variable."
suggested_fix = "gitlab_token = os.environ['GITLAB_TOKEN']"

[[rules]]
rule_id = "secret-slack-token"
name = "Slack Bot or User OAuth Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['xoxb-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}', 'xoxp-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}']
description = "Slack Bot or User OAuth token detected in code."
fix_hint = "Store Slack token in SLACK_BOT_TOKEN environment variable."
suggested_fix = "const slackToken = process.env.SLACK_BOT_TOKEN;"

[[rules]]
rule_id = "secret-twilio-api-key"
name = "Twilio API Key / Secret Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['SK[0-9a-fA-F]{32}']
description = "Twilio API Key SID detected in source code."
fix_hint = "Load Twilio credentials from TWILIO_API_KEY environment variable."
suggested_fix = "twilio_key = os.environ['TWILIO_API_KEY']"

[[rules]]
rule_id = "secret-sendgrid-api-key"
name = "SendGrid API Key"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['SG\.[a-zA-Z0-9_\-\.]{66}']
description = "SendGrid email delivery API key detected."
fix_hint = "Store in SENDGRID_API_KEY environment variable."
suggested_fix = "const apiKey = process.env.SENDGRID_API_KEY;"

[[rules]]
rule_id = "secret-npm-token"
name = "NPM Access Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['npm_[a-zA-Z0-9]{36}']
description = "NPM registry publish or read token detected."
fix_hint = "Revoke NPM token immediately and use NPM_TOKEN in CI/CD secrets."
suggested_fix = "NPM_TOKEN=process.env.NPM_TOKEN"

[[rules]]
rule_id = "secret-google-api-key"
name = "Google Cloud / Gemini API Key"
category = "SECRET_EXPOSURE"
severity = "HIGH"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['AIzaSy[0-9A-Za-z\-_]{33}']
description = "Google Cloud Platform or Gemini API key detected."
fix_hint = "Restrict API key scope in Google Cloud Console and load via GEMINI_API_KEY."
suggested_fix = "gemini_key = os.environ['GEMINI_API_KEY']"

[[rules]]
rule_id = "secret-private-key-header"
name = "Asymmetric Private Key Header"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['-----BEGIN (?:RSA|EC|DSA|OPENSSH) PRIVATE KEY-----']
description = "Raw cryptographic private key header detected directly in code."
fix_hint = "Store private keys in a secure secrets vault or file mounted outside source control."
suggested_fix = "private_key = Path('/run/secrets/server.key').read_text()"
