# --- Context-Based Provider Patterns (Low-Confidence Warnings, Requires Nearby Keyword + High Entropy) ---

[[rules]]
# Ref: https://docs.cohere.com/docs/api-keys (Context-based detection: bare 40-character token near cohere keyword with entropy >= 3.8. Low confidence warning.)
rule_id = "secret-cohere-api-key-context"
name = "Cohere API Key (Context-based)"
category = "SECRET_EXPOSURE"
severity = "LOW"
confidence = 0.5
entropy_min = 3.8
cwe_id = "CWE-798"
languages = ["*"]
patterns = ["(?i)(?:cohere(?:_api)?_key|cohere_token)\\s*=\\s*['\"]([a-zA-Z0-9]{40})['\"]"]
description = "Potential Cohere API key detected near assignment keyword with high Shannon entropy."
fix_hint = "Verify if this is a live Cohere token and load via COHERE_API_KEY environment variable."
suggested_fix = "cohere_key = os.environ['COHERE_API_KEY']"

[[rules]]
# Ref: https://docs.together.ai/docs/authentication (Context-based detection: bare 64-hex token near together keyword with entropy >= 3.8. Low confidence warning.)
rule_id = "secret-together-api-key-context"
name = "Together AI API Key (Context-based)"
category = "SECRET_EXPOSURE"
severity = "LOW"
confidence = 0.5
entropy_min = 3.8
cwe_id = "CWE-798"
languages = ["*"]
patterns = ["(?i)(?:together(?:_api)?_key|together_token)\\s*=\\s*['\"]([a-f0-9]{64})['\"]"]
description = "Potential Together AI API key detected near assignment keyword with high Shannon entropy."
fix_hint = "Verify if this is an active Together AI token and load via TOGETHER_API_KEY."
suggested_fix = "together_key = os.environ['TOGETHER_API_KEY']"
