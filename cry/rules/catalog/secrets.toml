[[rules]]
rule_id = "secret-google-api-key"
name = "Google Cloud / Gemini API Key"
category = "SECRET_EXPOSURE"
severity = "HIGH"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['AIzaSy[0-9A-Za-z\-_]{33}']
description = "Google Cloud Platform or Gemini API key detected."
fix_hint = "Restrict API key scope in Google Cloud Console and load via GEMINI_API_KEY."
suggested_fix = "gemini_key = os.environ['GEMINI_API_KEY']"

[[rules]]
rule_id = "secret-private-key-header"
name = "Asymmetric Private Key Header"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['-----BEGIN (?:RSA|EC|DSA|OPENSSH|(?:ENCRYPTED )?)PRIVATE KEY-----']
description = "Raw cryptographic private key header detected directly in code."
fix_hint = "Store private keys in a secure secrets vault or file mounted outside source control."
suggested_fix = "private_key = Path('/run/secrets/server.key').read_text()"

