# CRY Embedded Secrets Catalog (Inspired by Gitleaks standard signatures)

[[rules]]
rule_id = "secret-supabase-token"
name = "Supabase API Key / Service Role Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['sbp_[a-zA-Z0-9]{40}']
description = "Supabase access token or service role key exposed in source code."
fix_hint = "Store Supabase keys in environment variables (e.g. process.env.SUPABASE_KEY or os.environ['SUPABASE_KEY'])."
suggested_fix = "const supabaseKey = process.env.SUPABASE_SERVICE_ROLE_KEY;"

[[rules]]
rule_id = "secret-huggingface-token"
name = "Hugging Face Access Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['hf_[a-zA-Z0-9]{34}']
description = "Hugging Face API token detected in source code."
fix_hint = "Load Hugging Face token from environment variables via HF_TOKEN."
suggested_fix = "hf_token = os.environ['HF_TOKEN']"

[[rules]]
rule_id = "secret-github-pat"
name = "GitHub Personal Access Token"
category = "SECRET_EXPOSURE"
severity = "CRITICAL"
cwe_id = "CWE-798"
languages = ["*"]
patterns = ['ghp_[0-9a-zA-Z]{36}', 'github_pat_[0-9a-zA-Z_]{82}']
description = "GitHub Personal Access Token (Classic or Fine-Grained) committed to repository."
fix_hint = "Revoke token immediately in GitHub settings and load from GITHUB_TOKEN environment variable."
suggested_fix = "const token = process.env.GITHUB_TOKEN;"

[[rules]]
