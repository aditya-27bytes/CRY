# CRY Embedded SAST Catalog (Inspired by Semgrep and OWASP Top 10 rules)

[[rules]]
rule_id = "sast-react-dangerously-set-html"
name = "React XSS via dangerouslySetInnerHTML"
category = "INJECTION"
severity = "CRITICAL"
cwe_id = "CWE-79"
languages = [".tsx", ".jsx", ".js", ".ts"]
patterns = ['dangerouslySetInnerHTML\s*=\s*\{\s*\{\s*__html\s*:']
description = "Injecting raw HTML into the DOM bypasses React's automatic escaping, enabling Cross-Site Scripting (XSS)."
fix_hint = "Sanitize untrusted HTML with DOMPurify.sanitize() before setting dangerouslySetInnerHTML or use standard JSX."
suggested_fix = "<div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(userContent) }} />"

[[rules]]
rule_id = "sast-prototype-pollution"
name = "Node.js Prototype Pollution Risk"
category = "INJECTION"
severity = "HIGH"
cwe_id = "CWE-1321"
languages = [".ts", ".js", ".tsx", ".jsx"]
patterns = ["(?:\\[\\s*[\"']__proto__[\"']\\s*\\]|\\.constructor\\.prototype|\\.__proto__\\s*=)"]
description = "Modifying Object.prototype or __proto__ allows attackers to tamper with default object properties across the application."
fix_hint = "Use Object.create(null) for dictionaries or validate object keys against __proto__ and constructor."
suggested_fix = "const safeMap = Object.create(null);"

[[rules]]
rule_id = "sast-insecure-deserialization-yaml"
name = "Insecure PyYAML Deserialization (yaml.load)"
category = "INJECTION"
severity = "CRITICAL"
cwe_id = "CWE-502"
languages = [".py"]
patterns = ['yaml\.load\s*\([^)]*Loader\s*=\s*(?:yaml\.)?(?:UnsafeLoader|CLoader|Loader)\b', 'yaml\.load\s*\(\s*[^,\)]+\s*\)']
description = "Calling yaml.load() without yaml.SafeLoader can instantiate arbitrary Python objects and execute shell commands."
fix_hint = "Use yaml.safe_load() instead of yaml.load()."
suggested_fix = "data = yaml.safe_load(yaml_string)"

[[rules]]
rule_id = "sast-path-traversal"
name = "Path Traversal via Untrusted File Operation"
category = "INJECTION"
severity = "CRITICAL"
cwe_id = "CWE-22"
languages = [".py", ".ts", ".js"]
patterns = ['open\s*\([^)]*req\.(?:query|params|body)', 'fs\.readFile\s*\([^)]*req\.(?:query|params|body)']
description = "Passing user input directly to file system operations enables path traversal (e.g. ../../etc/passwd)."
fix_hint = "Normalize path and verify it stays inside the intended root directory via os.path.commonpath or path.resolve."
suggested_fix = "safe_path = (BASE_DIR / filename).resolve()\nif not safe_path.is_relative_to(BASE_DIR):\n    raise PermissionError('Invalid path')"

[[rules]]
rule_id = "sast-insecure-hash-md5-sha1"
name = "Weak Cryptographic Hash (MD5 / SHA1)"
category = "MISCONFIGURATION"
severity = "MEDIUM"
cwe_id = "CWE-328"
languages = [".py", ".ts", ".js"]
patterns = ["hashlib\\.(?:md5|sha1)\\s*\\(", "crypto\\.createHash\\s*\\(\\s*[\"'](?:md5|sha1)[\"']\\s*\\)"]
description = "MD5 and SHA1 suffer from practical collision attacks and must not be used for password hashing, signatures, or secure tokens."
fix_hint = "Use SHA-256 for integrity checks (hashlib.sha256()) or Argon2/bcrypt for passwords."
suggested_fix = "hasher = hashlib.sha256()"

[[rules]]
rule_id = "sast-jwt-none-algorithm"
name = "JWT Insecure Algorithm 'none' Allowed"
category = "AUTHENTICATION"
severity = "CRITICAL"
cwe_id = "CWE-327"
languages = [".py", ".ts", ".js"]
patterns = ["algorithms\\s*=\\s*\\[[^\\]]*[\"']none[\"']", "algorithm\\s*:\\s*[\"']none[\"']"]
description = "Allowing the 'none' algorithm permits unsigned JWT tokens, enabling attackers to forge administrative claims."
fix_hint = "Enforce strong asymmetric or symmetric algorithms like HS256, RS256, or EdDSA."
suggested_fix = 'jwt.decode(token, SECRET, algorithms=["HS256"])'

[[rules]]
rule_id = "sast-ssrf-untrusted-request"
name = "Potential SSRF via Direct URL Request"
category = "INJECTION"
severity = "HIGH"
cwe_id = "CWE-918"
languages = [".py", ".ts", ".js"]
patterns = ['requests\.(?:get|post)\s*\([^)]*req\.(?:args|query|params)', 'axios\.(?:get|post)\s*\([^)]*req\.(?:query|params|body)']
description = "Sending HTTP requests directly to an unvalidated user-supplied URL allows Server-Side Request Forgery (SSRF)."
fix_hint = "Validate URLs against an explicit domain whitelist and resolve DNS to block private IP addresses."
suggested_fix = "if not is_allowed_domain(target_url):\n    raise ValueError('Forbidden domain')\nrequests.get(target_url)"
